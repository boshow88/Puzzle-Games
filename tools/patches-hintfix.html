<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Patches — hint soundness / no-leak self-test</title>
  <style>
    body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 16px; }
    .pass { color: #128a12; } .fail { color: #c0272d; font-weight: 700; }
    h2 { margin: 18px 0 6px; } pre { white-space: pre-wrap; }
  </style>
  <script src="../js/common.js"></script>
  <script src="../js/generators/patches.js"></script>
</head>
<body>
  <h1 id="verdict">running…</h1>
  <pre id="out"></pre>
  <script>
  (function () {
    const I = window.PuzzleGenerators.patchesInternals;
    const PC = window.PuzzleCommon;
    const S = I.SHAPES;
    const out = [];
    let fails = 0;
    const log = (s, ok) => { out.push((ok === undefined ? '' : (ok ? '  ok  ' : ' FAIL ')) + s); if (ok === false) fails++; };

    // --- copy of the game's computeDeduction (post-fix), parameterised ------
    function clueIdxAt(clues, r, c) {
      for (let i = 0; i < clues.length; i++) if (clues[i].r === r && clues[i].c === c) return i;
      return -1;
    }
    function computeDeduction(clues, placements, N) {
      const clueAtArr = I.makeClueAt(N, clues);
      const owner = new Int32Array(N * N).fill(-1);
      const placementByClue = new Map();
      for (const rc of placements) {
        placementByClue.set(rc.clue, rc);
        for (let r = rc.r; r < rc.r + rc.h; r++)
          for (let c = rc.c; c < rc.c + rc.w; c++) owner[r * N + c] = rc.clue;
      }
      const freeFor = (R, i) => {
        for (let r = R.r; r < R.r + R.h; r++)
          for (let c = R.c; c < R.c + R.w; c++) {
            const o = owner[r * N + c]; if (o !== -1 && o !== i) return false;
          }
        return true;
      };
      const contains = (R, inner) => R.r <= inner.r && R.c <= inner.c
        && R.r + R.h >= inner.r + inner.h && R.c + R.w >= inner.c + inner.w;
      const sameRect = (a, b) => a.r === b.r && a.c === b.c && a.w === b.w && a.h === b.h;
      const active = [];
      for (let i = 0; i < clues.length; i++) {
        const partial = placementByClue.get(i) || null;
        let cands = I.enumerateCandidates(N, clues[i], i, clueAtArr).filter((R) => freeFor(R, i));
        if (partial) cands = cands.filter((R) => contains(R, partial));
        active.push({ i, partial, cands });
      }
      const candidates = [];
      for (const a of active) {
        if (a.cands.length !== 1) continue;
        const only = a.cands[0];
        if (a.partial && sameRect(only, a.partial)) continue;
        candidates.push({ kind: 'deduce', rc: Object.assign({}, only, { clue: a.i }), clue: a.i, tier: a.partial ? 1 : 2 });
      }
      const coverClue = new Int32Array(N * N).fill(-1);
      const coverCount = new Int32Array(N * N);
      for (const a of active) {
        const seen = new Set();
        for (const R of a.cands)
          for (let r = R.r; r < R.r + R.h; r++)
            for (let c = R.c; c < R.c + R.w; c++) {
              const k = r * N + c; if (seen.has(k)) continue; seen.add(k);
              if (coverClue[k] !== a.i) { coverCount[k] += 1; coverClue[k] = a.i; }
            }
      }
      for (let k = 0; k < N * N; k++) {
        if (owner[k] !== -1 || coverCount[k] !== 1) continue;
        const r = (k / N) | 0, c = k % N;
        if (clueIdxAt(clues, r, c) >= 0) continue;
        const clue = coverClue[k], cl = clues[clue], base = placementByClue.get(clue);
        const r0 = base ? base.r : cl.r, c0 = base ? base.c : cl.c;
        const r1 = base ? base.r + base.h - 1 : cl.r, c1 = base ? base.c + base.w - 1 : cl.c;
        const minR = Math.min(r0, r), minC = Math.min(c0, c), maxR = Math.max(r1, r), maxC = Math.max(c1, c);
        candidates.push({ kind: 'deduce-cell', rc: { r: minR, c: minC, w: maxC - minC + 1, h: maxR - minR + 1, clue }, cell: [r, c], clue, tier: 3 });
      }
      const area = (t) => t.w * t.h;
      const encloses = (o, t) => o.r <= t.r && o.c <= t.c && o.r + o.h >= t.r + t.h && o.c + o.w >= t.c + t.w;
      const kept = candidates.filter((h) => !candidates.some((o) => o !== h && o.clue === h.clue && area(o.rc) > area(h.rc) && encloses(o.rc, h.rc)));
      kept.sort((a, b) => a.tier - b.tier);
      return kept[0] || null;
    }

    // --- 1) explicit regression: a no-size neighbour that can grow to a -----
    //         free cell must NOT let that cell be "forced" to another clue.
    log('1) no-leak regression (a growable no-size neighbour blocks a false Tier 3)');
    {
      const N = 4;
      // B = wide, NO size, clue at (1,0); A = any, size 2, clue at (0,3).
      const clues = [
        { r: 1, c: 0, shape: S.WIDE, size: null },  // idx 0  (B)
        { r: 0, c: 3, shape: S.ANY, size: 2 },       // idx 1  (A)
      ];
      // B placed as 1x3 (cols 0..2, row 1). Cell (1,3) is reachable by BOTH
      // B (grow to 1x4) and A (vertical 2 down col 3) → must not be forced.
      const placements = [{ r: 1, c: 0, w: 3, h: 1, clue: 0 }];
      const h = computeDeduction(clues, placements, N);
      const bad = h && h.kind === 'deduce-cell' && h.cell[0] === 1 && h.cell[1] === 3;
      log('cell (1,3) is not falsely forced to clue A' + (h ? ' (got ' + h.kind + (h.cell ? ' @' + h.cell : '') + ')' : ' (got null)'), !bad);
    }

    // --- helpers for generated walkthroughs --------------------------------
    function clueIndexFor(clues, rect) {
      for (let i = 0; i < clues.length; i++)
        if (rect.r <= clues[i].r && clues[i].r < rect.r + rect.h
          && rect.c <= clues[i].c && clues[i].c < rect.c + rect.w) return i;
      return -1;
    }
    function genPuzzle(N, diff, seed) {
      const rng = PC.rng.make(seed >>> 0);
      let rects = null, clues = null;
      for (let a = 0; a < 40; a++) {
        const rr = I.tileGrid(N, rng, diff), cc = I.cluesFromTiling(rr, rng);
        if (I.isUnique(N, cc)) { rects = rr; clues = cc; break; }
      }
      if (!clues) { rects = I.tileGrid(N, rng, diff); clues = I.cluesFromTiling(rects, rng); }
      I.digDifficulty(N, clues, diff, rng, Date.now() + 4000);
      const solution = rects.map((rect) => ({ r: rect.r, c: rect.c, w: rect.w, h: rect.h, clue: clueIndexFor(clues, rect) }));
      return { N, clues, solution };
    }
    const inRect = (R, r, c) => R.r <= r && r < R.r + R.h && R.c <= c && c < R.c + R.w;

    // --- 2) generated walkthroughs: every hint sound + solves --------------
    const configs = [
      { N: 6, diff: 'easy' }, { N: 6, diff: 'medium' },
      { N: 8, diff: 'easy' }, { N: 8, diff: 'medium' },
      { N: 10, diff: 'easy' }, { N: 10, diff: 'medium' },
    ];
    for (const cfg of configs) {
      let unsound = 0, unsolved = 0, ran = 0;
      for (let s = 1; s <= 12; s++) {
        let puz; try { puz = genPuzzle(cfg.N, cfg.diff, 7000 + s * 131 + cfg.N); } catch (e) { if (ran === 0 && s === 1) log('   (genPuzzle threw: ' + (e && e.message) + ' @ ' + (e && e.stack ? e.stack.split('\n')[1] : '?') + ')'); continue; }
        ran++;
        const solByClue = new Map(); puz.solution.forEach((r) => solByClue.set(r.clue, r));
        const placed = new Map(); // clue -> solution rect
        let steps = 0, ok = true;
        while (steps++ < puz.clues.length + 4) {
          const placements = [...placed.values()].map((r) => ({ r: r.r, c: r.c, w: r.w, h: r.h, clue: r.clue }));
          const covered = placements.reduce((a, r) => a + r.w * r.h, 0);
          if (covered === cfg.N * cfg.N) break; // solved
          const h = computeDeduction(puz.clues, placements, cfg.N);
          if (!h) { ok = false; break; } // stuck though not solved → incomplete
          // soundness: the hint's conclusion must agree with the unique solution
          const sol = solByClue.get(h.clue);
          if (h.kind === 'deduce') {
            if (!(h.rc.r === sol.r && h.rc.c === sol.c && h.rc.w === sol.w && h.rc.h === sol.h)) { unsound++; }
          } else if (h.kind === 'deduce-cell') {
            if (!inRect(sol, h.cell[0], h.cell[1])) { unsound++; }
          }
          // follow the hint: lock in that clue's full solution rectangle
          placed.set(h.clue, sol);
        }
        const covered = [...placed.values()].reduce((a, r) => a + r.w * r.h, 0);
        if (!ok || covered !== cfg.N * cfg.N) unsolved++;
      }
      const tag = `2) ${cfg.N}x${cfg.N} ${cfg.diff}: ran ${ran}`;
      log(`${tag} — every hint sound`, unsound === 0);
      log(`${tag} — hint-walkthrough solves all`, unsolved === 0);
    }

    document.getElementById('out').textContent = out.join('\n');
    const v = document.getElementById('verdict');
    v.textContent = fails === 0 ? 'ALL TESTS PASSED' : (fails + ' TEST(S) FAILED');
    v.className = fails === 0 ? 'pass' : 'fail';
  })();
  </script>
</body>
</html>
