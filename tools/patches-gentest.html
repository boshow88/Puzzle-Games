<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Patches — leveled solver / difficulty self-test</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 16px; }
    .pass { color: #128a12; } .fail { color: #c0272d; font-weight: 700; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    pre { white-space: pre-wrap; }
  </style>
  <script src="../js/common.js"></script>
  <script src="../js/generators/patches.js"></script>
</head>
<body>
  <h1 id="verdict">running…</h1>
  <div id="tbl"></div>
  <pre id="out"></pre>
  <script>
  (async function () {
    const G = window.PuzzleGenerators.patches;           // the real entry point
    const I = window.PuzzleGenerators.patchesInternals;
    const TECH = I.TECHNIQUES_BY_DIFFICULTY;
    const SCORE = TECH.medium;                            // one scale for all tiers
    const out = [];
    let fails = 0;
    const fail = (m) => { out.push(' FAIL ' + m); fails++; };

    const same = (a, b) => { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return false; return true; };
    const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor((s.length - 1) / 2)]; };
    // solution rects carry .clue (= clue index), which is exactly the owner
    // grid scorePuzzle expects (cell → owning clue index).
    const ownerFromSolution = (N, solution) => {
      const o = new Int32Array(N * N).fill(-1);
      solution.forEach((rc) => { for (let r = rc.r; r < rc.r + rc.h; r++) for (let c = rc.c; c < rc.c + rc.w; c++) o[r * N + c] = rc.clue; });
      return o;
    };

    // Drive the SHIPPED generate() a few seeds per (size, tier). Validate:
    //   • solvable at its own tier AND resolving to its own solution (sound),
    //   • medium lands inside its target window (the whole point of the new
    //     dig-to-window scheme; the closest-fallback may occasionally miss),
    //   • median hardness climbs easy ≤ medium ≤ hard.
    const SEEDS = [11, 23, 47, 88, 131];
    const rows = [];
    const medianHardness = {};
    for (const N of [6, 8, 10]) {
      const band = I.mediumBand(N);
      out.push(`N=${N}: medium window = [${band.lo.toFixed(0)}, ${band.hi.toFixed(0)}], attempts m/h = ${I.attemptsFor(N, 'medium')}/${I.attemptsFor(N, 'hard')}`);
      for (const diff of ['easy', 'medium', 'hard']) {
        const scores = []; let totalMs = 0, inBand = 0, lastNum = 0, lastAny = 0;
        for (const seed of SEEDS) {
          let p;
          const t0 = performance.now();
          try { p = await G(N, diff, seed); } catch (e) { fail(`gen ${N} ${diff} #${seed}: ${e && e.message}`); continue; }
          totalMs += performance.now() - t0;
          const owner = ownerFromSolution(N, p.solution);
          const res = I.solveWithTechniques(N, p.clues, TECH[diff]);
          if (!res.solved) fail(`${N} ${diff} #${seed}: NOT solvable at its own tier`);
          else if (!same(res.owner, owner)) fail(`${N} ${diff} #${seed}: solves to a DIFFERENT tiling (unsound!)`);
          const H = I.scorePuzzle(N, p.clues, owner, SCORE);
          scores.push(H);
          if (diff === 'medium' && H >= band.lo - 1e-6 && H <= band.hi + 1e-6) inBand++;
          lastNum = p.clues.filter((c) => c.size != null).length;
          lastAny = p.clues.filter((c) => c.shape === 'any').length;
        }
        if (!scores.length) { fail(`${N} ${diff}: no puzzle generated`); continue; }
        const med = median(scores);
        medianHardness[`${N}${diff}`] = med;
        if (diff === 'medium' && inBand === 0) fail(`${N} medium: 0/${SEEDS.length} landed in window`);
        rows.push({
          key: `${N}x${N} ${diff}`,
          n: scores.length, numbered: lastNum, anys: lastAny,
          ms: (totalMs / scores.length).toFixed(0),
          hardness: `${Math.min(...scores).toFixed(0)}–${med.toFixed(0)}–${Math.max(...scores).toFixed(0)}`,
          band: diff === 'medium' ? `${inBand}/${scores.length}` : '—',
        });
      }
      const e = medianHardness[`${N}easy`], m = medianHardness[`${N}medium`], h = medianHardness[`${N}hard`];
      if (e != null && m != null && h != null && !(h >= m && m >= e)) {
        fail(`${N}: median hardness not monotonic (easy ${e.toFixed(1)}, medium ${m.toFixed(1)}, hard ${h.toFixed(1)})`);
      }
    }

    // Density: sample many tilings per size and report the piece-count spread.
    for (const N of [8, 10, 12]) {
      const rng = window.PuzzleCommon.rng.make(7770 + N);
      let sum = 0, mn = 1e9, mx = 0;
      const S = 60;
      for (let s = 0; s < S; s++) { const p = I.tileGrid(N, rng).length; sum += p; mn = Math.min(mn, p); mx = Math.max(mx, p); }
      out.push(`density ${N}x${N}: pieces avg ${(sum / S).toFixed(1)} (min ${mn}, max ${mx}, of ${N * N} cells)`);
    }

    let html = '<table><tr><th>config</th><th>#seeds</th><th>#num</th><th>#any</th><th>avg ms</th><th>hardness min–med–max</th><th>in-window</th></tr>';
    for (const r of rows) html += `<tr><td>${r.key}</td><td>${r.n}</td><td>${r.numbered}</td><td>${r.anys}</td><td>${r.ms}</td><td>${r.hardness}</td><td>${r.band}</td></tr>`;
    html += '</table>';
    document.getElementById('tbl').innerHTML = html;
    document.getElementById('out').textContent = out.join('\n');
    const v = document.getElementById('verdict');
    v.textContent = fails === 0 ? 'ALL SOLVABILITY/SOUNDNESS CHECKS PASSED' : (fails + ' CHECK(S) FAILED');
    v.className = fails === 0 ? 'pass' : 'fail';
  })();
  </script>
</body>
</html>
