<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Patches — leveled solver / difficulty self-test</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 16px; }
    .pass { color: #128a12; } .fail { color: #c0272d; font-weight: 700; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    pre { white-space: pre-wrap; }
  </style>
  <script src="../js/common.js"></script>
  <script src="../js/generators/patches.js"></script>
</head>
<body>
  <h1 id="verdict">running…</h1>
  <div id="tbl"></div>
  <pre id="out"></pre>
  <script>
  (function () {
    const I = window.PuzzleGenerators.patchesInternals;
    const PC = window.PuzzleCommon;
    const TECH = I.TECHNIQUES_BY_DIFFICULTY;
    const WEAKER = { hard: 'medium', medium: 'easy', easy: null };
    const out = [];
    let fails = 0;
    const fail = (m) => { out.push(' FAIL ' + m); fails++; };

    const ownerOf = (N, rects) => {
      const o = new Int32Array(N * N).fill(-1);
      rects.forEach((rc, i) => { for (let r = rc.r; r < rc.r + rc.h; r++) for (let c = rc.c; c < rc.c + rc.w; c++) o[r * N + c] = i; });
      return o;
    };
    const same = (a, b) => { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return false; return true; };
    const cloneClues = (cs) => cs.map((c) => ({ ...c }));

    // One base tiling per size (deadline-bounded, like generate()).
    function pickBase(N, seed, capMs) {
      const rng = PC.rng.make(seed >>> 0);
      const dl = Date.now() + capMs;
      let rects = null, clues = null;
      for (let a = 0; a < 40; a++) {
        const rr = I.tileGrid(N, rng, 'hard'), cc = I.cluesFromTiling(rr, rng);
        if (I.isUnique(N, cc)) { rects = rr; clues = cc; break; }
        if (Date.now() > dl) { rects = rr; clues = cc; break; }
      }
      if (!clues) { rects = I.tileGrid(N, rng, 'hard'); clues = I.cluesFromTiling(rects, rng); }
      return { rng, clues, solutionOwner: ownerOf(N, rects) };
    }

    const rows = [];
    const hardnessOf = {};
    for (const N of [6, 8, 10]) {
      let base; try { base = pickBase(N, 3100 + N, 1200); } catch (e) { fail(`pickBase ${N}: ${e && e.message}`); continue; }
      for (const diff of ['easy', 'medium', 'hard']) {
        // Carve a pool (as generate() does): hard ships the hardest carve,
        // medium the median, easy its single carve. Dig seed is difficulty-
        // INDEPENDENT so medium & hard share one pool → hard ≥ medium.
        const K = I.bestOfK(N, diff);
        const carves = []; let totalMs = 0;
        for (let k = 0; k < K; k++) {
          const cand = cloneClues(base.clues);
          const rng = PC.rng.make(5000 + N * 7 + k * 131);
          const t0 = performance.now();
          try { I.digDifficulty(N, cand, base.solutionOwner, diff, rng, Date.now() + 500); }
          catch (e) { fail(`dig ${N} ${diff}: ${e && e.message}`); continue; }
          totalMs += performance.now() - t0;
          carves.push({ clues: cand, score: I.scorePuzzle(N, cand, base.solutionOwner, TECH[diff]) });
        }
        if (!carves.length) { fail(`${N} ${diff}: no valid carve`); continue; }
        carves.sort((a, b) => a.score - b.score);
        const chosen = carves[diff === 'medium' ? Math.floor((carves.length - 1) * 0.5) : carves.length - 1];
        const clues = chosen.clues;
        const bestScore = chosen.score;
        const res = I.solveWithTechniques(N, clues, TECH[diff]);
        if (!res.solved) fail(`${N} ${diff}: NOT solvable at its own tier`);
        else if (!same(res.owner, base.solutionOwner)) fail(`${N} ${diff}: solves to a DIFFERENT tiling (unsound!)`);
        hardnessOf[`${N}${diff}`] = bestScore;
        rows.push({
          key: `${N}x${N} ${diff}`, K, numbered: clues.filter((c) => c.size != null).length,
          anys: clues.filter((c) => c.shape === 'any').length,
          ms: totalMs.toFixed(0), hardness: bestScore.toFixed(1),
          solved: res.solved && same(res.owner, base.solutionOwner) ? 'yes' : 'NO',
        });
      }
      // Difficulty must climb: hard ≥ medium ≥ easy (by hardness score).
      const e = hardnessOf[`${N}easy`], m = hardnessOf[`${N}medium`], h = hardnessOf[`${N}hard`];
      if (e != null && m != null && h != null && !(h >= m && m >= e)) {
        fail(`${N}: hardness not monotonic (easy ${e.toFixed(1)}, medium ${m.toFixed(1)}, hard ${h.toFixed(1)})`);
      }
    }

    // Micro-benchmark: single hard solve on FULL 12x12 clues (worst case).
    let big = '';
    try {
      const rng = PC.rng.make(4242); const dl = Date.now() + 1500; let rects = null, clues = null;
      for (let a = 0; a < 40; a++) { const rr = I.tileGrid(12, rng, 'hard'), cc = I.cluesFromTiling(rr, rng); if (I.isUnique(12, cc)) { rects = rr; clues = cc; break; } if (Date.now() > dl) { rects = rr; clues = cc; break; } }
      const t0 = performance.now(); const r = I.solveWithTechniques(12, clues, TECH.hard); const ms = performance.now() - t0;
      big = `bench: single hard solve on FULL 12x12 clues = ${ms.toFixed(1)}ms (solved=${r.solved})`;
    } catch (e) { big = 'bench threw: ' + (e && e.message); }

    // Density: sample many tilings per size and report the piece-count spread
    // (should be lower on average than the old fixed density, with variety).
    for (const N of [8, 10, 12]) {
      const rng = PC.rng.make(7770 + N);
      let sum = 0, mn = 1e9, mx = 0;
      const S = 60;
      for (let s = 0; s < S; s++) { const p = I.tileGrid(N, rng, 'medium').length; sum += p; mn = Math.min(mn, p); mx = Math.max(mx, p); }
      out.push(`density ${N}x${N}: pieces avg ${(sum / S).toFixed(1)} (min ${mn}, max ${mx}, of ${N * N} cells)`);
    }

    let html = '<table><tr><th>config</th><th>K</th><th>#num</th><th>#any</th><th>total ms</th><th>hardness</th><th>solved</th></tr>';
    for (const r of rows) html += `<tr><td>${r.key}</td><td>${r.K}</td><td>${r.numbered}</td><td>${r.anys}</td><td>${r.ms}</td><td>${r.hardness}</td><td>${r.solved}</td></tr>`;
    html += '</table>';
    document.getElementById('tbl').innerHTML = html;
    out.unshift(big);
    document.getElementById('out').textContent = out.join('\n');
    const v = document.getElementById('verdict');
    v.textContent = fails === 0 ? 'ALL SOLVABILITY/SOUNDNESS CHECKS PASSED' : (fails + ' CHECK(S) FAILED');
    v.className = fails === 0 ? 'pass' : 'fail';
  })();
  </script>
</body>
</html>
