<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8" />
  <title>Zip — generator self-test</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 16px; }
    .pass { color: #128a12; } .fail { color: #c0272d; font-weight: 700; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    pre { white-space: pre-wrap; }
  </style>
  <script src="../js/common.js"></script>
  <script src="../js/generators/zip.js"></script>
</head>
<body>
  <h1 id="verdict">running…</h1>
  <div id="tbl"></div>
  <pre id="out"></pre>
  <script>
  (async function () {
    const G = window.PuzzleGenerators.zip, I = window.PuzzleGenerators.zipInternals;
    const out = []; let fails = 0;
    const fail = (m) => { out.push(' FAIL ' + m); fails++; };
    const md = (a) => { a = a.slice().sort((x, y) => x - y); return a[a.length >> 1]; };

    // Independent (cell-based) solution counter — no edge-solver prunes — used
    // to cross-validate that the edge solver's uniqueness is sound.
    function cellCount(N, wallSet, cpNum, cp1, cpK, K, cap, budget) {
      const M = N * N, adj = I.buildAdj(N);
      const vis = new Uint8Array(M); let cnt = 0, nodes = 0, aborted = false;
      const openNbrs = (id) => adj[id].filter((nb) => !wallSet.has(I.edgeKey(id, nb)));
      function reach(head, remaining) {
        if (remaining === 0) return true;
        const seen = new Uint8Array(M), st = []; let c = 0;
        for (const nb of openNbrs(head)) if (!vis[nb] && !seen[nb]) { seen[nb] = 1; st.push(nb); }
        while (st.length) { const x = st.pop(); c++; for (const nb of openNbrs(x)) if (!vis[nb] && !seen[nb]) { seen[nb] = 1; st.push(nb); } }
        return c === remaining && seen[cpK] === 1;
      }
      function dfs(head, nextCp, vc) {
        if (aborted || cnt >= cap) return;
        if (++nodes > budget) { aborted = true; return; }
        if (vc === M) { if (head === cpK && nextCp === K + 1) cnt++; return; }
        const rem = M - vc;
        if (!reach(head, rem)) return;
        for (const nb of openNbrs(head)) {
          if (vis[nb]) continue;
          const n = cpNum[nb];
          if (n !== 0) { if (n !== nextCp) continue; if (n === K && rem !== 1) continue; }
          vis[nb] = 1; dfs(nb, n !== 0 ? nextCp + 1 : nextCp, vc + 1); vis[nb] = 0;
          if (cnt >= cap || aborted) return;
        }
      }
      vis[cp1] = 1; dfs(cp1, 2, 1);
      return aborted ? -1 : cnt;
    }

    // Rebuild solver inputs from a generated puzzle; return uniqueness (strong
    // solver) + difficulty (weak solver branch count) + a solution sanity check.
    function check(p) {
      const N = p.size, M = N * N, model = I.edgeModel(N), adj = I.buildAdj(N);
      const wallSet = new Set(p.walls.map(([a, b]) => I.edgeKey(I.idOf(a[0], a[1], N), I.idOf(b[0], b[1], N))));
      const cpNum = new Int32Array(M); p.checkpoints.forEach((cp) => { cpNum[I.idOf(cp.r, cp.c, N)] = cp.n; });
      const K = p.checkpoints.length;
      const cp1 = I.idOf(p.checkpoints[0].r, p.checkpoints[0].c, N);
      const cpK = I.idOf(p.checkpoints[K - 1].r, p.checkpoints[K - 1].c, N);
      // solution validity: covers all cells, adjacent + wall-free, order ok, ends at cpK
      const path = p.solution.map(([r, c]) => I.idOf(r, c, N));
      let okPath = path.length === M && new Set(path).size === M && path[0] === cp1 && path[path.length - 1] === cpK;
      for (let i = 1; i < path.length && okPath; i++) { const a = path[i - 1], b = path[i]; if (!adj[a].includes(b) || wallSet.has(I.edgeKey(a, b))) okPath = false; }
      let exp = 1; for (const id of path) { const n = cpNum[id]; if (n) { if (n !== exp) okPath = false; exp++; } }
      const strong = I.analyzeEdges(N, model, wallSet, cpNum, cp1, cpK, K, 2, 500000, false);
      const weak = I.analyzeEdges(N, model, wallSet, cpNum, cp1, cpK, K, 2, 15000, false, { order: false, conn: false });
      // Independent cross-check (small N only — cell counter is unpruned/slow).
      let xok = true;
      if (N <= 8) { const cc = cellCount(N, wallSet, cpNum, cp1, cpK, K, 2, 3000000); if (cc !== -1 && cc !== strong.count) xok = false; }
      return { okPath, xok, unique: strong.count === 1 && !strong.aborted, weak: weak.aborted ? 99999 : weak.branches, walls: p.walls.length, cps: p.checkpoints.length };
    }

    // Full correctness+monotonicity matrix on N≤10 (fast). N=12 is a single
    // sanity gen (uniqueness+timing) since each 12×12 gen is ~1–2 min.
    const SEEDS = [11, 29, 47];
    const rows = [];
    for (const N of [6, 8, 10]) {
      let bad = 0;
      for (const diff of ['easy', 'medium', 'hard']) {
        const times = [], ws = []; let walls = 0, cps = 0;
        for (const seed of SEEDS) {
          const t0 = performance.now();
          let p; try { p = await G(N, diff, seed); } catch (e) { fail(`gen ${N} ${diff} #${seed}: ${e && e.message}`); continue; }
          times.push(performance.now() - t0);
          const c = check(p);
          if (!c.okPath) fail(`${N} ${diff} #${seed}: invalid solution path`);
          if (!c.xok) fail(`${N} ${diff} #${seed}: edge/cell counter DISAGREE (unsound prune!)`);
          if (!c.unique) { fail(`${N} ${diff} #${seed}: NOT unique`); bad++; }
          ws.push(c.weak); walls = c.walls; cps = c.cps;
        }
        rows.push({ key: `${N}x${N} ${diff}`, cps, walls, ms: times.length ? (times.reduce((a, b) => a + b, 0) / times.length).toFixed(0) : '-', diffScore: ws.join(','), unique: `${SEEDS.length - bad}/${SEEDS.length}` });
      }
      // Difficulty lever = checkpoint density (more anchors ⇒ easier). Per-board
      // counts now jitter (and ranges overlap), so verify monotonicity on the
      // deterministic BASE count (mult = 1) instead of a single jittered sample.
      const bE = I.cpCountFor(N, 'easy'), bM = I.cpCountFor(N, 'medium'), bH = I.cpCountFor(N, 'hard');
      if (!(bE > bM && bM > bH)) fail(`${N}: base checkpoint density not monotonic (E ${bE} / M ${bM} / H ${bH})`);
    }

    // Single 12×12 sanity gen (medium): confirm it completes, is unique, timing.
    { const t0 = performance.now(); let p;
      try { p = await G(12, 'medium', 11); } catch (e) { fail(`gen 12 medium #11: ${e && e.message}`); }
      if (p) { const c = check(p); if (!c.okPath) fail('12 medium #11: invalid path'); if (!c.unique) fail('12 medium #11: NOT unique');
        rows.push({ key: '12x12 medium', cps: c.cps, walls: c.walls, ms: (performance.now() - t0).toFixed(0), diffScore: String(c.weak) }); }
    }

    let html = '<table><tr><th>config</th><th>#cp</th><th>#wall</th><th>avg ms</th><th>weak-branches (per seed)</th></tr>';
    for (const r of rows) html += `<tr><td>${r.key}</td><td>${r.cps}</td><td>${r.walls}</td><td>${r.ms}</td><td>${r.diffScore}</td></tr>`;
    html += '</table>';
    document.getElementById('tbl').innerHTML = html;
    document.getElementById('out').textContent = out.join('\n');
    const v = document.getElementById('verdict');
    v.textContent = fails === 0 ? 'ALL ZIP CHECKS PASSED (unique + monotonic difficulty)' : (fails + ' CHECK(S) FAILED');
    v.className = fails === 0 ? 'pass' : 'fail';
  })();
  </script>
</body>
</html>
